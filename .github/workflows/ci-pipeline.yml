name: Pipeline

on:
  pull_request:
    branches: [main]
  push:
    # main -> UAT (continuous). release/** branches and release tags -> PROD.
    # A tag push matches only the tags filter, so tags are prod-only.
    #
    # Operational tags carry an environment prefix (sit-rebuild-*,
    # prod-release-v*, uat-platform-rebuild-*, uat-daily-build-*), so these
    # globs are deliberately unanchored — a bare daily-build-* misses the
    # uat-daily-build-* tags the cross-repo daily snapshot actually creates.
    branches: [main, "release/**"]
    tags: ["v*", "*-rebuild-*", "*-release-*", "*daily-build-*"]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: Target environment (sit, uat or prod)
        required: false
        default: "uat"
        type: choice
        options:
          - sit
          - uat
          - prod
      internal_service_token:
        description: Optional ACP auth token
        required: false
        default: ""
        type: string
      source_ref:
        description: Immutable source ref to build when production promotion is dispatched from main
        required: false
        default: ""
        type: string
      image_tag:
        description: Artifact Registry tag to publish for an explicit promotion
        required: false
        default: ""
        type: string
      push_image:
        description: Publish the built Accounts image to the configured registries
        required: false
        default: ""
        type: string
      push_latest:
        description: Also update the latest image tag when publishing
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pre_check:
    name: Pre-check - ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: prep
            name: Prep
          - check: native_schema_initialization
            name: Native Schema Initialization (PostgreSQL 17)
          - check: managed_database_runtime
            name: Managed Database Runtime (PostgreSQL 17)
          - check: full_business_transfer
            name: Full Business Transfer (PostgreSQL 17)
          - check: account_lifecycle_migration
            name: Account Lifecycle Migration (PostgreSQL 17)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      deploy_env: ${{ steps.flags.outputs.deploy_env }}
      push_image: ${{ steps.flags.outputs.push_image }}
      push_latest: ${{ steps.flags.outputs.push_latest }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set Up Go
        if: matrix.check != 'prep'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve Pipeline Flags
        id: flags
        env:
          IMAGE_REPO_OWNER: ${{ vars.IMAGE_REPO_OWNER || github.repository_owner }}
          INPUT_DEPLOY_ENV: ${{ inputs.deploy_env }}
          INPUT_PUSH_IMAGE: ${{ inputs.push_image }}
          INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash ./scripts/github-actions/resolve-pipeline-flags.sh >> "$GITHUB_OUTPUT"

      - name: Install PostgreSQL client
        if: matrix.check != 'prep'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Prepare native account fixture
        if: matrix.check == 'native_schema_initialization' || matrix.check == 'managed_database_runtime'
        env:
          PGPASSWORD: postgres
        run: createdb --host localhost --port 5432 --username postgres account

      - name: Prepare full-business fixtures
        if: matrix.check == 'full_business_transfer'
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host localhost --port 5432 --username postgres account
          createdb --host localhost --port 5432 --username postgres full_business_source
          createdb --host localhost --port 5432 --username postgres full_business_native_source

      - name: Qualify compiled schema and native initialization guards
        if: matrix.check == 'native_schema_initialization'
        env:
          MIGRATECTL_NATIVE_TEST_DSN: postgres://postgres:postgres@localhost:5432/account?sslmode=disable
        run: go test -v ./sql ./cmd/migratectl ./internal/migrate

      - name: Qualify managed startup, readonly facts and standby isolation
        if: matrix.check == 'managed_database_runtime'
        env:
          ACCOUNTS_MANAGED_RUNTIME_TEST_DSN: postgres://postgres:postgres@localhost:5432/account?sslmode=disable
        run: go test -v ./config ./internal/dbruntime ./cmd/accountsvc -run 'TestManaged|TestDatabaseRole'

      - name: Compile the same complete server package as the prebuilt image
        if: matrix.check == 'managed_database_runtime'
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/accounts-runtime-fixture" ./cmd/accountsvc

      - name: Qualify readonly visibility, full fields, batching and rollback
        if: matrix.check == 'full_business_transfer'
        env:
          MIGRATECTL_FULL_BUSINESS_TEST_DSN: postgres://postgres:postgres@localhost:5432/account?sslmode=disable
        run: go test -v ./internal/migrate -run '^TestFullBusiness'

      - name: Run controlled migration PostgreSQL integration test (required)
        if: matrix.check == 'account_lifecycle_migration'
        env:
          PGPASSWORD: postgres
          CONTROLLED_TEST_DB: controlled_migration_test_${{ github.run_id }}_${{ github.run_attempt }}
          ACCOUNTS_TEST_POSTGRES_DSN_REQUIRED: "1"
        run: |
          set -euo pipefail
          createdb --host localhost --port 5432 --username postgres "$CONTROLLED_TEST_DB"
          export ACCOUNTS_TEST_POSTGRES_DSN="postgres://postgres:postgres@localhost:5432/${CONTROLLED_TEST_DB}?sslmode=disable"
          go test -count=1 -v ./internal/migrate -run '^TestControlledMigratePostgresIntegration$'

      - name: Apply lifecycle migration fixture twice and verify guards
        if: matrix.check == 'account_lifecycle_migration'
        env:
          PGPASSWORD: postgres
        run: >-
          psql "postgres://postgres@localhost:5432/postgres?sslmode=disable"
          --set ON_ERROR_STOP=1
          --file sql/migrations/tests/account_lifecycle_upgrade_test.sql

      - name: Apply finance migration fixture twice in a fresh database
        if: matrix.check == 'account_lifecycle_migration'
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          createdb --host localhost --port 5432 --username postgres finance_ledger_upgrade_test
          psql "postgres://postgres@localhost:5432/finance_ledger_upgrade_test?sslmode=disable" \
            --set ON_ERROR_STOP=1 \
            --file sql/migrations/tests/local_finance_ledger_upgrade_test.sql

      - name: Preserve full-business legacy compatibility across repeated upgrades
        if: matrix.check == 'account_lifecycle_migration'
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          createdb --host localhost --port 5432 --username postgres full_business_compat_test
          psql "postgres://postgres@localhost:5432/full_business_compat_test?sslmode=disable" \
            --set ON_ERROR_STOP=1 \
            --file sql/migrations/tests/full_business_legacy_compat_upgrade_test.sql

  build:
    name: Build Accounts image (${{ matrix.platform }})
    needs: pre_check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            artifact_name: accounts-image-linux-amd64
            archive_name: accounts-linux-amd64.tar
    runs-on: ubuntu-latest
    env:
      SERVICE_REGISTRY: ghcr.io
      SERVICE_IMAGE_REPO_OWNER: ${{ vars.IMAGE_REPO_OWNER || github.repository_owner }}
      SERVICE_IMAGE_NAME: accounts
    outputs:
      service_image_repo: ${{ steps.service_image.outputs.repo }}
      service_image_tag: ${{ steps.service_ref.outputs.image_tag }}
      service_image_commit: ${{ steps.service_ref.outputs.image_commit }}
      service_image_ref: ${{ steps.service_ref.outputs.image_ref }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Resolve checked out source commit
        id: source
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Resolve Service Image Repository
        id: service_image
        run: echo "repo=${SERVICE_REGISTRY}/${SERVICE_IMAGE_REPO_OWNER}/${SERVICE_IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Compute Service Image Tags
        id: service_meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ steps.service_image.outputs.repo }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') || github.ref_type == 'tag' }}
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
            type=raw,value=latest,enable=${{ needs.pre_check.outputs.push_latest == 'true' || github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ steps.source.outputs.commit }}

      - name: Resolve Service Image Ref
        id: service_ref
        env:
          SERVICE_IMAGE_REPO: ${{ steps.service_image.outputs.repo }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          image_tag="sha-${SOURCE_COMMIT}"
          image_ref="${SERVICE_IMAGE_REPO}:${image_tag}"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "image_commit=${SOURCE_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"

      - name: Build Accounts image archive
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.archive_name }}
          tags: ${{ steps.service_ref.outputs.image_ref }}
          labels: ${{ steps.service_meta.outputs.labels }}

      - name: Upload Accounts image archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/${{ matrix.archive_name }}
          if-no-files-found: error
          retention-days: 1

  publish_artifact_registry:
    name: Publish ${{ matrix.target_name }}
    needs: [pre_check, build]
    if: >-
      ${{ needs.build.result == 'success' &&
          (needs.pre_check.outputs.push_image == 'true' ||
           (github.event_name == 'push' && github.ref_type == 'tag') ||
           (github.event_name == 'workflow_dispatch' && inputs.deploy_env == 'prod' && inputs.source_ref != '' && inputs.image_tag != '') ||
           (github.event_name == 'push' && github.ref_type == 'tag' && contains(github.ref_name, 'daily-build-'))) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: github
            target_name: GitHub Container Registry
            artifact_name: accounts-image-linux-amd64
            archive_name: accounts-linux-amd64.tar
          - target: artifact_registry
            target_name: Google Artifact Registry
            artifact_name: accounts-image-linux-amd64
            archive_name: accounts-linux-amd64.tar
          - target: release
            target_name: Release Manifest and Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Resolve publish target
        id: target
        env:
          PUBLISH_TARGET: ${{ matrix.target }}
          PUSH_IMAGE: ${{ needs.pre_check.outputs.push_image }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEPLOY_ENV: ${{ inputs.deploy_env }}
          SOURCE_REF: ${{ inputs.source_ref }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          enabled=false
          promotion=false
          if [[ "$EVENT_NAME" == workflow_dispatch && "$DEPLOY_ENV" == prod && \
                -n "$SOURCE_REF" && -n "$IMAGE_TAG" ]]; then
            promotion=true
          fi
          if [[ "$PUBLISH_TARGET" == github && "$PUSH_IMAGE" == true && \
                "$promotion" != true ]]; then
            enabled=true
          elif [[ "$PUBLISH_TARGET" == artifact_registry && \
                  "$EVENT_NAME" == push && "$REF_TYPE" == tag ]] || \
               [[ "$PUBLISH_TARGET" == artifact_registry && "$promotion" == true ]]; then
            enabled=true
          elif [[ "$PUBLISH_TARGET" == release && "$EVENT_NAME" == push && \
                  "$REF_TYPE" == tag && "$REF_NAME" == *daily-build-* ]]; then
            enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Check Out Repository
        if: steps.target.outputs.enabled == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Download Accounts image archive
        if: steps.target.outputs.enabled == 'true' && (matrix.target == 'github' || matrix.target == 'artifact_registry')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/accounts-image

      - name: Resolve checked out source commit
        id: source
        if: steps.target.outputs.enabled == 'true' && (matrix.target == 'github' || matrix.target == 'artifact_registry')
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Load Accounts image archive
        if: steps.target.outputs.enabled == 'true' && (matrix.target == 'github' || matrix.target == 'artifact_registry')
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/accounts-image/${{ matrix.archive_name }}
        run: docker load --input "$IMAGE_ARCHIVE"

      - name: Verify built Accounts image
        if: steps.target.outputs.enabled == 'true' && (matrix.target == 'github' || matrix.target == 'artifact_registry')
        env:
          SOURCE_IMAGE_REF: ${{ needs.build.outputs.service_image_ref }}
        run: docker image inspect "$SOURCE_IMAGE_REF" >/dev/null

      - name: Load Vault Secrets for GHCR
        id: vault
        if: steps.target.outputs.enabled == 'true' && matrix.target == 'github'
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: github-actions-accounts-${{ needs.pre_check.outputs.deploy_env }}
          jwtGithubAudience: vault
          exportEnv: false
          # GHCR 推送凭据在 kv/data/CICD(第 ① 层公共服务 secret, 三个环境
          # role 共读)。kv/data/github-actions 这个路径不存在, 返回 403 ——
          # 而 403 与"role 没建"、"绑定不匹配"完全同形, 日志里看不出区别。
          secrets: |
            kv/data/CICD GHCR_TOKEN | GHCR_TOKEN ;

      - name: Log In To GHCR
        if: steps.target.outputs.enabled == 'true' && matrix.target == 'github'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME || github.repository_owner }}
          password: ${{ steps.vault.outputs.GHCR_TOKEN || github.token }}

      - name: Compute GHCR image tags
        id: service_meta
        if: steps.target.outputs.enabled == 'true' && matrix.target == 'github'
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ vars.IMAGE_REPO_OWNER || github.repository_owner }}/accounts
          tags: |
            type=ref,event=tag
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') || github.ref_type == 'tag' }}
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
            type=raw,value=latest,enable=${{ needs.pre_check.outputs.push_latest == 'true' || github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ steps.source.outputs.commit }}

      - name: Push Accounts image to GHCR
        if: steps.target.outputs.enabled == 'true' && matrix.target == 'github'
        env:
          SOURCE_IMAGE_REF: ${{ needs.build.outputs.service_image_ref }}
          GHCR_TAGS: ${{ steps.service_meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker tag "$SOURCE_IMAGE_REF" "$tag"
            docker push "$tag"
          done <<< "$GHCR_TAGS"

      - name: Authenticate to Google Cloud
        id: gcp
        if: steps.target.outputs.enabled == 'true' && matrix.target == 'artifact_registry'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1004637461064/locations/global/workloadIdentityPools/github-actions/providers/github-actions-platform-ops
          service_account: gha-platform-ops-uat@xworktech.iam.gserviceaccount.com
          token_format: access_token

      - name: Log In To Artifact Registry
        if: steps.target.outputs.enabled == 'true' && matrix.target == 'artifact_registry'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: asia-northeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}

      - name: Push Accounts image to Artifact Registry
        if: steps.target.outputs.enabled == 'true' && matrix.target == 'artifact_registry'
        env:
          SOURCE_IMAGE_REF: ${{ needs.build.outputs.service_image_ref }}
          DESTINATION_IMAGE: asia-northeast1-docker.pkg.dev/xworktech/serverless/accounts:${{ inputs.image_tag || github.ref_name }}
        run: |
          set -euo pipefail
          docker tag "$SOURCE_IMAGE_REF" "$DESTINATION_IMAGE"
          docker push "$DESTINATION_IMAGE"

      - name: Publish release manifest and assets
        id: assets
        if: steps.target.outputs.enabled == 'true' && matrix.target == 'release'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_REFS: ${{ needs.build.outputs.service_image_ref }}
          RELEASE_BUILD_COMMAND: >-
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w"
            -o "$RUNNER_TEMP/release-assets/accounts" ./cmd/accountsvc
            && zip -j "$RUNNER_TEMP/release-assets/accounts-${{ github.ref_name }}.zip"
            "$RUNNER_TEMP/release-assets/accounts"
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-release-artifacts.sh

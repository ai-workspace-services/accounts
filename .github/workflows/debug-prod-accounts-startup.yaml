name: Debug prod accounts startup

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Cloud Run revision to inspect
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1004637461064/locations/global/workloadIdentityPools/github-actions/providers/github-actions-platform-ops
          service_account: gha-platform-ops-uat@xworktech.iam.gserviceaccount.com
          token_format: access_token

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Read Cloud Run startup logs
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          gcloud run revisions describe "${REVISION}" \
            --region=asia-northeast1 \
            --project=xworktech \
            --format='yaml(metadata.name,status.conditions,status.containerStatuses)'
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="prod-accounts" AND resource.labels.revision_name="'"${REVISION}"'"' \
            --project=xworktech \
            --limit=100 \
            --order=asc \
            --format='value(timestamp,severity,textPayload,jsonPayload.message,jsonPayload.error)' \
            --freshness=2h

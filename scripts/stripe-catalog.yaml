# 声明式 Stripe 目录 —— 唯一事实源。
#
# 这份文件描述"应该有哪些 Product / Price / Webhook"，不含任何密钥。
# 由 scripts/stripe-sync-catalog.sh 读取，对 Stripe API 做幂等同步:
# 仅保留 free / plus / pro / custom 四个系列套餐（无 trial、无 payg）。
# Dev 模式使用 STRIPE_SECRET_KEY=sk_test_... (Sandbox)；
# PROD 模式使用 STRIPE_SECRET_KEY=sk_live_... (Live)。

products:
  - key: plus
    name: "Plus"
    description: "Plus 订阅用户：30元/月 · 30GB · 共享资源池 · 3天欠款宽限期"
    prices:
      - key: plus-monthly-2026
        plan_id: PLUS-MONTHLY-2026
        unit_amount: 3000            # ¥30.00 / 月
        currency: cny
        recurring_interval: month

  - key: pro
    name: "Pro"
    description: "Pro 订阅用户：50元/月 · 50GB/月 · PRO专属资源池 · 3天欠款宽限期"
    prices:
      - key: pro-monthly-2026
        plan_id: PRO-MONTHLY-2026
        unit_amount: 5000            # ¥50.00 / 月
        currency: cny
        recurring_interval: month

  - key: custom-node
    name: "定制节点"
    description: "定制节点订阅用户：80元/月 · 独享IP · 独享节点 · 每个月免费更换一次，再次更换10元/次"
    prices:
      - key: custom-node-monthly-2026
        plan_id: CUSTOM-NODE-MONTHLY-2026
        unit_amount: 8000            # ¥80.00 / 月
        currency: cny
        recurring_interval: month

  - key: custom-ai-consult
    name: "AI 工具咨询，电脑环境配置"
    description: "面向非订阅用户的付费服务：100元/小时/次（支持：MacOS Windows Linux IOS Android，不支持：国产华为纯血鸿蒙系统）"
    prices:
      - key: custom-ai-consult-2026
        plan_id: CUSTOM-AI-CONSULT-2026
        unit_amount: 10000           # ¥100.00 / 小时/次（一次性购买）
        currency: cny

# Webhook URL/secret 由 Vault 和环境声明提供；脚本只验证已有端点，不输出 secret。
webhook:
  path: /api/billing/stripe/webhook
  events:
    - checkout.session.completed
    - customer.subscription.created
    - customer.subscription.updated
    - customer.subscription.deleted
    - invoice.paid
    - invoice.payment_failed
